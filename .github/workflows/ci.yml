name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=app python -m unittest discover -s tests -v
      - run: docker compose config --quiet
      - run: docker build -t paperlane:ci .
      - name: Verify the web page runs as a non-root user
        run: |
          docker run -d --name print-smoke --network none --user 1000:1000 --tmpfs /data:rw,mode=1777 --cap-drop ALL paperlane:ci
          docker exec -i print-smoke python - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  html = urllib.request.urlopen('http://127.0.0.1:8080/', timeout=2).read()
                  assert b'settings-dialog' in html
                  break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(.5)
          PY
      - name: Stop smoke test
        if: always()
        run: docker rm -f print-smoke || true
